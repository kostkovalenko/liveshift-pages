<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiveShift Privacy Policy</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #111111;
      --muted: #6e6e73;
      --border: #e5e5ea;
      --accent: #0a84ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }
    h1 { font-size: 40px; line-height: 1.1; margin: 0 0 12px; }
    p { margin: 0 0 14px; }
    .muted { color: var(--muted); }
    .links {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }
    a.button {
      display: block;
      text-decoration: none;
      color: var(--text);
      background: #f2f2f7;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      font-weight: 600;
    }
    a.button:hover { border-color: var(--accent); }
    .footer {
      margin-top: 22px;
      font-size: 14px;
      color: var(--muted);
    }
    .inline-link { color: var(--accent); }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>LiveShift</h1>
      <p class="muted">Privacy Policy pages for App Store review and GitHub Pages hosting.</p>

      <div class="links">
        <a class="button" href="./privacy-policy-en.html">Privacy Policy — English</a>
        <a class="button" href="./privacy-policy-uk.html">Політика конфіденційності — Українська</a>
        <a class="button" href="./support.html">Support</a>
      </div>

      <p class="footer">
        Standard Apple Terms of Use (EULA):
        <a class="inline-link" href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/">
          apple.com/legal/internet-services/itunes/dev/stdeula/
        </a>
      </p>
    </section>
  </main>
</body>
</html>
